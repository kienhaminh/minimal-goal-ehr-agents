[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-goal-ehr-agents"
version = "0.1.0"
description = "Clinical workflow agents with minimal goals and an institutional environment on MedAgentBench v2"
requires-python = ">=3.11"
dependencies = ["openai>=1.76", "pydantic>=2.10", "requests>=2.32"]  # openai: imported by the upstream MedAgentBench tools

# The modules in src/ form the package `clinical_agent`.
[tool.setuptools]
packages = ["clinical_agent"]
package-dir = { clinical_agent = "src" }
